<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>恐怖视频（胆小勿入）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f; color: #e8eef7; min-height: 100vh;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 60px; -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 900px; }

  .v-title {
    font-size: clamp(22px, 4.2vh, 34px); font-weight: 700; letter-spacing: .06em;
    text-align: center; margin-bottom: 6px; color: #fff;
  }
  .v-sub {
    font-size: clamp(12px, 1.7vh, 15px); color: rgba(255,255,255,.42);
    text-align: center; letter-spacing: .1em; margin-bottom: 26px;
  }

  .player {
    position: relative; width: 100%; background: #000;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.55);
    border: 1px solid rgba(160, 200, 255, .18);
  }
  video { display: block; width: 100%; height: auto; max-height: 76vh; background: #000; }

  .meta {
    margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-items: center;
  }
  .tag {
    font-size: 12px; letter-spacing: .08em; color: #8fb6e8;
    background: rgba(30, 70, 130, .35); border: 1px solid rgba(120, 170, 230, .3);
    border-radius: 6px; padding: 5px 12px;
  }

  .hint {
    margin-top: 26px; text-align: center; font-size: 12px; line-height: 1.9;
    color: rgba(255,255,255,.3); letter-spacing: .04em;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1 class="v-title">白色恐怖</h1>
  <div class="v-sub">你为什么要打开这个视频？？？？</div>

  <div class="player">
    <!-- ↓ 把 my-video.mp4 改成你的视频文件名（建议英文/拼音，如 travel.mp4） -->
    <video controls preload="metadata" playsinline>
      <source src="1.mp4" type="video/mp4">
      你的浏览器不支持视频播放，请更换浏览器或下载观看。
    </video>
  </div>

  <div class="meta">
    <span class="tag">MP4</span>
    <span class="tag">2026</span>
    <span class="tag">???</span>
  </div>


</div>
</body>
</html>
