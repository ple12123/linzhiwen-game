<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林治文</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #0a0a0f; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; align-items: center; justify-content: center; }

  #app { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .stage {
    position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
    background: #000; overflow: hidden; user-select: none; cursor: pointer;
  }

  /* ---------- 背景 ---------- */
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity .6s ease, filter .8s ease; opacity: 0; }
  .bg.show { opacity: 1; }
  .bg.afternoon { background-image: linear-gradient(180deg, #ffd89b 0%, #f7a96b 42%, #c96a3e 72%, #8f4630 100%); }
  .bg.noon      { background-image: linear-gradient(180deg, #dff0ff 0%, #bfe0f5 45%, #8fc4e0 78%, #6ba7c9 100%); }
  .bg.dusk      { background-image: linear-gradient(180deg, #ffb36b 0%, #ff8a5c 38%, #c85f7c 70%, #5b3a6e 100%); }
  .bg.night     { background-image: linear-gradient(180deg, #2b3358 0%, #1c2140 55%, #101327 100%); }
  .bg-layer { position: absolute; inset: 0; }
  .bg-vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%); }
  /* 跑道装饰（用于无 CG 的操场场景） */
  .track-deco { position: absolute; inset: 0; pointer-events: none; opacity: .35; }
  .track-deco i { position: absolute; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.55); border-radius: 50%; height: 6px; }

  /* ---------- 对话框 ---------- */
  .textbox {
    position: absolute; left: 5%; right: 5%; bottom: 5%; min-height: 27%;
    background: rgba(12, 28, 62, .82); border: 2px solid rgba(190, 220, 255, .45);
    border-radius: 10px; padding: 26px 30px 22px; backdrop-filter: blur(3px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .nameline {
    position: absolute; top: -19px; left: 22px;
    background: rgba(22, 54, 116, .96); border: 2px solid rgba(200, 226, 255, .7);
    border-radius: 8px; padding: 3px 20px; font-size: clamp(14px, 1.9vh, 20px);
    font-weight: 700; color: #d9ecff; letter-spacing: .06em;
  }
  .dialog-text {
    font-size: clamp(15px, 2.35vh, 23px); line-height: 1.85; color: #f2f6ff; letter-spacing: .02em;
  }
  .note-text { font-size: clamp(13px, 1.9vh, 18px); color: #ff9a9a; margin-top: 10px; letter-spacing: .02em; }

  /* ---------- 旁白 ---------- */
  .narration {
    position: absolute; left: 8%; right: 8%; bottom: 9%;
    text-align: center; font-size: clamp(15px, 2.35vh, 23px); line-height: 1.95;
    color: #f0f0f0; text-shadow: 0 2px 10px rgba(0,0,0,.9), 0 0 22px rgba(0,0,0,.65);
    letter-spacing: .03em;
  }

  /* ---------- 场景转场卡 ---------- */
  .placecard {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; background: rgba(6,10,20,.55); backdrop-filter: blur(2px);
  }
  .placecard .pc-main {
    font-size: clamp(18px, 3.1vh, 30px); color: #fff; letter-spacing: .22em;
    text-shadow: 0 2px 14px rgba(0,0,0,.9);
  }
  .placecard .pc-sub { font-size: clamp(12px, 1.7vh, 16px); color: rgba(255,255,255,.62); letter-spacing: .3em; }

  /* ---------- 选项 ---------- */
  .choicewrap {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; background: rgba(6,12,26,.5);
  }
  .choicewrap .ctitle {
    font-size: clamp(15px, 2.2vh, 22px); color: #cfe6ff; margin-bottom: 8px; letter-spacing: .08em;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }
  .optbtn {
    width: min(70%, 620px); text-align: left; cursor: pointer;
    background: rgba(18, 46, 96, .9); border: 2px solid rgba(150, 200, 255, .55);
    border-radius: 10px; padding: 15px 24px; color: #eaf3ff;
    font-size: clamp(14px, 2.05vh, 20px); line-height: 1.6; letter-spacing: .02em;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
    font-family: inherit;
  }
  .optbtn:hover { background: rgba(34, 82, 156, .95); border-color: #9fd0ff; transform: translateY(-2px); }
  .optbtn .lb { color: #7fc0ff; font-weight: 700; margin-right: 12px; }

  /* ---------- 结局 ---------- */
  .endcard {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: linear-gradient(180deg, rgba(8,14,30,.86), rgba(8,14,30,.94));
  }
  .endcard .en-no { font-size: clamp(13px, 1.9vh, 18px); color: #8fc0ff; letter-spacing: .35em; }
  .endcard .en-name { font-size: clamp(26px, 5.4vh, 54px); color: #fff; letter-spacing: .16em; text-shadow: 0 4px 20px rgba(0,0,0,.8); }
  .endcard .en-route { font-size: clamp(12px, 1.75vh, 17px); color: rgba(255,255,255,.66); letter-spacing: .06em; text-align: center; line-height: 1.9; }
  .endcard .en-tip { font-size: clamp(11px, 1.55vh, 15px); color: rgba(255,255,255,.42); letter-spacing: .12em; margin-top: 6px; }

  /* ---------- 标题画面 ---------- */
  .titlecard {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: linear-gradient(135deg, #141c33 0%, #0c1226 60%, #1a1330 100%);
  }
  .titlecard .t-main { font-size: clamp(34px, 7.4vh, 74px); color: #fff; letter-spacing: .3em; text-indent: .3em; text-shadow: 0 4px 26px rgba(90,150,255,.4); }
  .titlecard .t-sub { font-size: clamp(12px, 1.75vh, 17px); color: #8fb6e8; letter-spacing: .34em; text-indent: .34em; margin-top: 2px; }
  .titlecard .t-ends { font-size: clamp(11px, 1.55vh, 15px); color: rgba(255,255,255,.4); letter-spacing: .1em; margin-top: 14px; }
  .btn-main {
    margin-top: 26px; cursor: pointer; font-family: inherit;
    background: rgba(28, 74, 148, .92); border: 2px solid rgba(160, 210, 255, .6);
    border-radius: 10px; padding: 13px 44px; color: #eaf3ff;
    font-size: clamp(14px, 2.05vh, 20px); letter-spacing: .2em; text-indent: .2em;
    transition: background .15s ease, transform .15s ease;
  }
  .btn-main:hover { background: rgba(44, 106, 194, .96); transform: translateY(-2px); }
  .btn-ghost {
    cursor: pointer; font-family: inherit; background: rgba(255,255,255,.06);
    border: 1px solid rgba(180,210,255,.35); border-radius: 8px; padding: 8px 22px;
    color: #cfe0f5; font-size: clamp(12px, 1.65vh, 16px); letter-spacing: .12em;
  }
  .btn-ghost:hover { background: rgba(255,255,255,.13); }

  /* ---------- 工具条 ---------- */
  .toolbar {
    position: absolute; top: 12px; right: 14px; display: flex; gap: 8px; z-index: 20;
  }
  .toolbar button {
    cursor: pointer; font-family: inherit; font-size: clamp(10px, 1.45vh, 14px);
    background: rgba(10,20,44,.6); border: 1px solid rgba(160,200,255,.32);
    color: #bcd6f2; border-radius: 6px; padding: 5px 11px; letter-spacing: .06em;
  }
  .toolbar button:hover { background: rgba(30,60,110,.8); color: #fff; }
  .toolbar button.on { background: rgba(60,120,200,.85); color: #fff; }

  /* ---------- 历史面板 ---------- */
  .history {
    position: absolute; inset: 0; z-index: 30; background: rgba(6,10,22,.95);
    overflow-y: auto; padding: 46px 6% 40px; display: none;
  }
  .history.show { display: block; }
  .history h3 { color: #8fc0ff; font-size: clamp(14px, 2vh, 19px); letter-spacing: .2em; margin-bottom: 18px; }
  .history .hitem { margin-bottom: 14px; line-height: 1.8; font-size: clamp(12px, 1.85vh, 17px); color: #dfe8f5; }
  .history .hitem .hn { color: #7fc0ff; font-weight: 700; margin-right: 10px; }
  .history .hitem .hplace { color: rgba(255,255,255,.38); font-style: italic; }
  .history .closebtn { position: fixed; top: 14px; right: 16px; }

  /* ---------- 点击指示 ---------- */
  .nextmark {
    position: absolute; right: 8%; bottom: 6.5%; width: 14px; height: 14px;
    border-right: 3px solid rgba(220,235,255,.85); border-bottom: 3px solid rgba(220,235,255,.85);
    transform: rotate(-45deg); animation: blink 1.15s infinite;
  }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }
  .fade { animation: fadein .35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <div class="bg-layer" id="bgA"></div>
    <div class="bg-layer" id="bgB"></div>
    <div class="bg-vignette"></div>
    <div class="track-deco" id="trackDeco"></div>
    <div id="content"></div>
    <div class="toolbar" id="toolbar" style="display:none">
      <button id="btnAuto">自动</button>
      <button id="btnSkip">跳过</button>
      <button id="btnHist">历史</button>
      <button id="btnTitle">标题</button>
    </div>
    <div class="history" id="histPanel">
      <h3>历 史</h3>
      <div id="histList"></div>
    </div>
  </div>
</div>

/* ================= 引擎 ================= */
const stage = document.getElementById("stage");
const content = document.getElementById("content");
const bgA = document.getElementById("bgA");
const bgB = document.getElementById("bgB");
const toolbar = document.getElementById("toolbar");
const histPanel = document.getElementById("histPanel");
const histList = document.getElementById("histList");
const trackDeco = document.getElementById("trackDeco");

let idx = 0;
let history = [];
let choices = [];      // 记录本次走过的选择
let typing = null;     // 打字机 timer
let typingDone = true;
let autoMode = false;
let autoTimer = null;
let mode = "title";    // title | playing | ending

const LABELS = {};
SCRIPT.forEach((s, i) => { if (s.t === "label") LABELS[s.id] = i; });

function unlockedEnds() {
  try { return JSON.parse(localStorage.getItem("dyj_ends") || "[]"); } catch (e) { return []; }
}
function unlockEnd(no, name) {
  let list = unlockedEnds();
  if (!list.some(e => e.no === no)) { list.push({ no, name }); localStorage.setItem("dyj_ends", JSON.stringify(list)); }
}

/* ---------- 背景 ---------- */
function setBg(v, f) {
  const isCg = v && v.startsWith("cg");
  const url = isCg ? CG[v] : "";
  const cls = isCg ? "" : (v || "night");
  const layer = bgA.classList.contains("show") ? bgB : bgA;
  const other = layer === bgA ? bgB : bgA;
  layer.className = "bg-layer bg " + cls;
  if (isCg) layer.style.backgroundImage = "url(" + url + ")";
  else layer.style.backgroundImage = "";
  layer.style.filter = FILTERS[f] || "none";
  layer.style.backgroundSize = "cover";
  layer.style.backgroundPosition = "center";
  layer.style.opacity = "0";
  // 强制重排后淡入
  void layer.offsetWidth;
  layer.style.transition = "opacity .55s ease";
  layer.style.opacity = "1";
  other.style.opacity = "0";
  other.classList.remove("show");
  layer.classList.add("show");
  // 跑道装饰：仅渐变操场背景显示
  trackDeco.innerHTML = "";
  if (!isCg && (v === "afternoon" || v === "dusk")) {
    for (let i = 0; i < 5; i++) {
      const line = document.createElement("i");
      line.style.width = (46 + i * 12) + "%";
      line.style.bottom = (6 + i * 5) + "%";
      trackDeco.appendChild(line);
    }
  }
}

/* ---------- 打字机 ---------- */
function typeText(el, text, speed) {
  if (typing) { clearInterval(typing); typing = null; }
  el.textContent = "";
  typingDone = false;
  let i = 0;
  const step = speed || 26;
  typing = setInterval(() => {
    i += 1;
    el.textContent = text.slice(0, i);
    if (i >= text.length) { clearInterval(typing); typing = null; typingDone = true; }
  }, step);
}
function finishTyping() {
  if (typing) { clearInterval(typing); typing = null; typingDone = true;
    const el = content.querySelector(".typing"); if (el && el.dataset.full) el.textContent = el.dataset.full; }
}

/* ---------- 渲染 ---------- */
function renderItem(auto) {
  while (idx < SCRIPT.length) {
    const s = SCRIPT[idx];
    if (s.t === "bg") { setBg(s.v, s.f); idx++; continue; }
    if (s.t === "label" || s.t === "goto") {
      if (s.t === "goto") { idx = LABELS[s.v]; continue; }
      idx++; continue;
    }
    break;
  }
  if (idx >= SCRIPT.length) { showTitle(); return; }
  const s = SCRIPT[idx];

  content.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "fade";
  content.appendChild(wrap);

  if (s.t === "place") {
    mode = "playing";
    history.push({ place: true, text: "— " + s.v + " —" });
    wrap.innerHTML = '<div class="placecard"><div class="pc-main">— ' + s.v + ' —</div><div class="pc-sub">' + (s.sub || "") + '</div></div>';
    setTimeout(() => { if (!autoMode) return; }, 0);
    idx++;
    if (autoMode) scheduleAuto(1500);
    return;
  }

  if (s.t === "choice") {
    mode = "playing";
    const box = document.createElement("div");
    box.className = "choicewrap";
    const t = document.createElement("div");
    t.className = "ctitle";
    t.textContent = "【选择】" + s.title;
    box.appendChild(t);
    s.opts.forEach(o => {
      const b = document.createElement("button");
      b.className = "optbtn";
      b.innerHTML = '<span class="lb">' + o.lb + '</span>' + o.v;
      b.onclick = (e) => {
        e.stopPropagation();
        choices.push(o.lb);
        idx = LABELS[o.goto];
        renderItem();
      };
      box.appendChild(b);
    });
    wrap.appendChild(box);
    return;
  }

  if (s.t === "end") {
    mode = "ending";
    unlockEnd(s.no, s.name);
    const box = document.createElement("div");
    box.className = "endcard";
    box.innerHTML =
      '<div class="en-no">E N D &nbsp;' + s.no + '</div>' +
      '<div class="en-name">' + s.name + '</div>' +
      '<div class="en-route">本次路线：' + (choices.length ? choices.join(" → ") : "—") + '</div>' +
      '<div class="en-tip">已解锁结局 ' + unlockedEnds().length + " / 3</div>";
    const b = document.createElement("button");
    b.className = "btn-ghost";
    b.textContent = "返回标题";
    b.onclick = (e) => { e.stopPropagation(); showTitle(); };
    box.appendChild(b);
    wrap.appendChild(box);
    return;
  }

  if (s.t === "d") {
    mode = "playing";
    history.push({ name: s.name, text: "「" + s.v + "」" });
    const box = document.createElement("div");
    box.className = "textbox";
    const nl = document.createElement("div");
    nl.className = "nameline";
    nl.textContent = s.name;
    const tx = document.createElement("div");
    tx.className = "dialog-text typing";
    tx.dataset.full = "「" + s.v + "」";
    box.appendChild(nl); box.appendChild(tx);
    if (SCRIPT[idx + 1] && SCRIPT[idx + 1].t === "note") {
      const nt = document.createElement("div");
      nt.className = "note-text";
      nt.textContent = SCRIPT[idx + 1].v;
      box.appendChild(nt);
    }
    const nm = document.createElement("div");
    nm.className = "nextmark";
    box.appendChild(nm);
    wrap.appendChild(box);
    typeText(tx, "「" + s.v + "」", 24);
    idx++;
    if (SCRIPT[idx] && SCRIPT[idx].t === "note") idx++;
    if (autoMode) scheduleAuto();
    return;
  }

  if (s.t === "n" || s.t === "note") {
    mode = "playing";
    if (s.t === "n") history.push({ name: "", text: s.v });
    const box = document.createElement("div");
    box.className = "narration typing";
    box.dataset.full = s.v;
    const nm = document.createElement("div");
    nm.className = "nextmark";
    wrap.appendChild(box);
    wrap.appendChild(nm);
    typeText(box, s.v, 26);
    idx++;
    if (autoMode) scheduleAuto();
    return;
  }
  idx++;
}

function scheduleAuto(extra) {
  if (autoTimer) clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { if (autoMode && mode === "playing") advance(); }, extra || 2300);
}

function advance() {
  if (mode !== "playing") return;
  if (!typingDone) { finishTyping(); return; }
  renderItem();
}

/* ---------- 标题 ---------- */
function showTitle() {
  mode = "title";
  idx = 0; history = []; choices = [];
  if (autoTimer) clearTimeout(autoTimer); autoMode = false;
  document.getElementById("btnAuto").classList.remove("on");
  toolbar.style.display = "none";
  setBg("night", "none");
  content.innerHTML = "";
  const box = document.createElement("div");
  box.className = "titlecard fade";
  const ends = unlockedEnds();
  box.innerHTML =
    '<div class="t-main">林治文</div>' +
    '<div class="t-sub">第一视角 · GALGAME 风格视觉小说</div>' +
    '<div class="t-ends">已解锁结局 ' + ends.length + ' / 3' +
      (ends.length ? '　·　' + ends.map(e => "END " + e.no + " " + e.name).join("　") : '') + '</div>';
  const b = document.createElement("button");
  b.className = "btn-main";
  b.textContent = "开 始";
  b.onclick = (e) => { e.stopPropagation(); startGame(); };
  box.appendChild(b);
  const b2 = document.createElement("button");
  b2.className = "btn-ghost";
  b2.style.marginTop = "14px";
  b2.textContent = "操作说明";
  b2.onclick = (e) => {
    e.stopPropagation();
    alert("点击画面 / 空格 / 回车：推进对话\n自动：自动播放\n跳过：快进到下一个选项\n历史：查看已读文本\n\n共 4 个选择点、3 个结局。");
  };
  box.appendChild(b2);
  content.appendChild(box);
}

function startGame() {
  mode = "playing";
  idx = 0; history = []; choices = [];
  toolbar.style.display = "flex";
  renderItem();
}

/* ---------- 跳过：快进到下一个选项或结局 ---------- */
function skipToChoice() {
  if (mode !== "playing") return;
  let i = idx, guard = 0;
  while (i < SCRIPT.length && guard++ < 2000) {
    const s = SCRIPT[i];
    if (s.t === "choice" || s.t === "end") { idx = i; break; }
    i++;
  }
  // 跳过途中补齐背景
  let lastBg = null;
  for (let j = 0; j < idx; j++) if (SCRIPT[j].t === "bg") lastBg = SCRIPT[j];
  if (lastBg) setBg(lastBg.v, lastBg.f);
  renderItem();
}

/* ---------- 事件 ---------- */
stage.addEventListener("click", () => {
  if (histPanel.classList.contains("show")) return;
  if (mode === "title") return;
  if (mode === "ending") return;
  advance();
});
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") {
    e.preventDefault();
    if (mode === "title") { startGame(); return; }
    if (mode === "ending") { showTitle(); return; }
    advance();
  }
});
document.getElementById("btnAuto").onclick = (e) => {
  e.stopPropagation();
  autoMode = !autoMode;
  document.getElementById("btnAuto").classList.toggle("on", autoMode);
  if (!autoMode && autoTimer) clearTimeout(autoTimer);
  if (autoMode && mode === "playing") scheduleAuto(600);
};
document.getElementById("btnSkip").onclick = (e) => { e.stopPropagation(); skipToChoice(); };
document.getElementById("btnTitle").onclick = (e) => { e.stopPropagation(); showTitle(); };
document.getElementById("btnHist").onclick = (e) => {
  e.stopPropagation();
  histList.innerHTML = history.map(h => {
    if (h.place) return '<div class="hitem"><span class="hplace">' + h.text + '</span></div>';
    return '<div class="hitem">' + (h.name ? '<span class="hn">【' + h.name + '】</span>' : '') + h.text + '</div>';
  }).join("");
  histPanel.classList.add("show");
};
const closeBtn = document.createElement("button");
closeBtn.className = "btn-ghost closebtn";
closeBtn.textContent = "关闭";
closeBtn.onclick = (e) => { e.stopPropagation(); histPanel.classList.remove("show"); };
histPanel.appendChild(closeBtn);

showTitle();
